name: Update model multipliers

on:
  schedule:
    # Run daily at 08:10 UTC, shortly after the source repo typically publishes.
    - cron: '10 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-model-multipliers.yml
      - scripts/update-model-multipliers.py

permissions:
  contents: write
  pull-requests: write

jobs:
  update-model-multipliers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Check for updates and generate model multipliers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update-model-multipliers.py

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fixed branch name: every run updates the same branch (and thus the same open PR)
          # instead of opening a new PR per run.
          BRANCH_NAME: update/model-multipliers
          PR_TITLE: Update model multipliers from rajbos/github-copilot-model-notifier
        shell: bash
        run: |
          set -euo pipefail

          # Close any leftover PRs from the old per-run timestamped branches and delete those branches.
          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | test("^update/model-multipliers-[0-9]+$")) | .number' |
          while read -r pr; do
            echo "Closing superseded PR #$pr" >> $GITHUB_STEP_SUMMARY
            gh pr close "$pr" --delete-branch --comment "Superseded: model multiplier updates now go to a single PR from the \`$BRANCH_NAME\` branch."
          done

          EXISTING_PR=$(gh pr list --state open --base main --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')

          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes detected." >> $GITHUB_STEP_SUMMARY
            if [[ -n "$EXISTING_PR" ]]; then
              echo "main is already up to date; closing PR #$EXISTING_PR" >> $GITHUB_STEP_SUMMARY
              gh pr close "$EXISTING_PR" --delete-branch --comment "main is already up to date with the latest model multipliers."
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Rebuild the branch from the current main with only the latest generated file,
          # then force-push so the open PR always holds exactly one up-to-date commit.
          git checkout -B "$BRANCH_NAME"
          git add src/lib/model-multipliers.generated.ts
          git commit -m ":memo: Update model multipliers from rajbos/github-copilot-model-notifier"
          git push --force origin "$BRANCH_NAME"

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Updated existing PR #$EXISTING_PR" >> $GITHUB_STEP_SUMMARY
          else
            echo "Creating new PR" >> $GITHUB_STEP_SUMMARY
            gh pr create \
              --title "$PR_TITLE" \
              --body "Automated update of model multipliers from the latest release of [rajbos/github-copilot-model-notifier](https://github.com/rajbos/github-copilot-model-notifier/releases/latest). Generated by GitHub Actions. This PR is kept up to date by subsequent runs." \
              --head "$BRANCH_NAME" \
              --base main
          fi
